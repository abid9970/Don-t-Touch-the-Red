name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Locate Project & Build Debug APK
        run: |
          # Automatically find where settings.gradle.kts or build.gradle.kts is located
          SETTINGS_FILE=$(find . -name "settings.gradle*" | head -n 1)

          if [ -n "$SETTINGS_FILE" ]; then
            PROJECT_DIR=$(dirname "$SETTINGS_FILE")
            echo "Found project in: $PROJECT_DIR"
            cd "$PROJECT_DIR"
            gradle assembleDebug --stacktrace
          else
            echo "=== ROOT FILES NOT FOUND! LISTING ALL REPOSITORY FILES ==="
            find . -maxdepth 4 -not -path '*/.*'
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DontTouchTheRed-Game-APK
          path: "**/app/build/outputs/apk/debug/*.apk"
          retention-days: 7
